<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Box Model Practice</title>
        <script src="button.js" style="margin: auto;"></script>
        <style> 
            #redbox{
                background-color: red;
                height: 100px;
                width: 100px;
                border: 2px black solid;
                background-clip: content-box;
                margin-left: 300px;
            }
            #bluebox{
                background-color: blue;
                height: 100px;
                width: 100px;
                border: 2px black solid;
                padding: 100px;
                background-clip: content-box;
                margin-left: 400px;
            }
            #greenbox{
                background-color: green;
                height: 100px;
                width: 100px;
                padding-left: 20px;
                border: 2px black solid;
                background-clip: content-box;
            }
            #yellowbox{
                background-color: yellow;
                height: 100px;
                width: 100px;
                padding-top: 20px;
                padding-left: 10px;
                padding-right: 10px;
                background-clip: content-box;
                border: 2px black solid;
                margin-left: 300px;
            }
            #purplebox{
                background-color: purple; 
                height: 100px;
                width: 100px;
                margin-left: 200px;
                border: 2px black solid;
                padding-bottom: 100px;
                background-clip: content-box;
            }
        </style>
    </head>
    <body>
        <header>
            <h1>The boxes:</h1>
        </header>
        <main>
            <div id="redbox"></div>
            <div id="bluebox"></div>
            <div id="greenbox"></div>
            <div id="yellowbox"></div>
            <div id="purplebox"></div>
            <div id="openbox"></div>
            <p><button onclick="validateHTML()">Validate HTML/CSS</button></p>
        </main>
        <footer>

        </footer>
    </body>
</html>
